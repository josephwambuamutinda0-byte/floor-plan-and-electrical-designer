<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plan and Wire: floor plan and electrical designer</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f4;--panel:#fff;--ink:#1b2a3a;--mute:#5d6b7a;--line:#cfd7df;--grid:#d9e0e7;--wall:#1b2a3a;--room:#2f6fb01a;--acc:#c8571b;--ok:#2b7a4b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1826;--panel:#14243a;--ink:#e3ebf5;--mute:#93a5ba;--line:#2a3f5b;--grid:#1c3150;--wall:#e3ebf5;--room:#5aa0ff1f;--acc:#ff8a4c;--ok:#5ccf8c}}
:root[data-theme="dark"]{--bg:#0d1826;--panel:#14243a;--ink:#e3ebf5;--mute:#93a5ba;--line:#2a3f5b;--grid:#1c3150;--wall:#e3ebf5;--room:#5aa0ff1f;--acc:#ff8a4c;--ok:#5ccf8c}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 "IBM Plex Sans",system-ui,sans-serif}
.app{display:grid;grid-template-columns:180px 1fr 340px;grid-template-rows:auto 1fr;height:100%;gap:8px;padding:8px}
header{grid-column:1/-1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

.hint{color:var(--mute);font-size:12px;flex:1;min-width:200px}
.tools,.side{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px;overflow:auto}
.tools h4,.side h3{margin:10px 0 4px;font-size:12px;color:var(--mute);font-weight:600}
.tools h4:first-child{margin-top:0}
button,select,input{font:inherit;color:var(--ink)}
.tb{display:block;width:100%;text-align:left;margin:2px 0;padding:6px 8px;border:1px solid var(--line);background:transparent;border-radius:6px;cursor:pointer}
.tb.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tb:focus-visible,select:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.btn{padding:6px 10px;border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer}
.canvas{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;min-height:0}
#svg{display:block;width:100%;min-width:720px;touch-action:none;cursor:crosshair}
#wbar{position:sticky;top:0;left:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:6px 8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}#wbar[hidden]{display:none}.tools details{margin:2px 0}.tools summary{cursor:pointer;font-size:12px;font-weight:600;color:var(--mute);padding:4px 2px}#pdfpg{display:none}body.desktop header .btn,body.desktop header h1{display:none!important}.app.tmin{grid-template-columns:1fr 340px}.app.tmin .tools{display:none}@media(max-width:900px){.app.tmin{grid-template-columns:1fr;grid-template-rows:auto minmax(380px,1fr) auto}}
@media screen{.app.smin{grid-template-columns:180px 1fr}.app.smin .side{display:none}.app.tmin.smin{grid-template-columns:1fr}}
@media screen and (max-width:900px){.app.smin{grid-template-columns:1fr;grid-template-rows:auto auto minmax(380px,1fr)}.app.tmin.smin{grid-template-rows:auto minmax(380px,1fr)}}
#prt{display:none}#ptitle{display:none;text-align:center;font-weight:600;font-size:18px;padding:6px;border-bottom:2px solid #000;color:#000}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:3px 4px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 5px;max-width:100%}
input[type=number]{width:70px}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.big{font-size:22px;font-weight:600}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:4px 0}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto auto minmax(380px,1fr) auto;height:auto}header{grid-column:1}.tools{display:flex;flex-wrap:wrap;gap:4px}.tools h4{width:100%;margin:4px 0 0}.tb{width:auto}}
@media print{html:root:root:root{--bg:#fff;--panel:#fff;--ink:#1b2a3a;--mute:#5d6b7a;--line:#cfd7df;--grid:#e3e8ee;--wall:#1b2a3a;--room:#2f6fb01a;--acc:#c8571b}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}.tools,header .btn,#wbar,#pbar{display:none!important}.app{display:block;height:auto}.canvas{overflow:visible;border:0}#svg{min-width:0}.side{overflow:visible;border:0;break-before:page}body{background:#fff}.app{padding:0;gap:0}.canvas{border-radius:0}#svg{width:100%;height:auto;min-width:0}.sec{break-inside:avoid}body[data-print=plan] .side,body[data-print=pdf] .side{display:none!important}body[data-print]:not([data-print=plan]):not([data-print=all]):not([data-print=pdf]) .canvas{display:none!important}body[data-print] .side>*:not(.sec){display:none!important}body[data-print=cost] .sec:not([data-s=cost]),body[data-print=circuits] .sec:not([data-s=circuits]),body[data-print=cable] .sec:not([data-s=cable]),body[data-print=materials] .sec:not([data-s=materials]),body[data-print=legend] .sec:not([data-s=legend]){display:none!important}.hint{display:none!important}.gridrect{display:none}body[data-print][data-pdf="0"] .pdfbg{display:none}.lgi:not(.used){display:none!important}.noprint{display:none!important}body[data-lic="0"] .app,body[data-lic="0"] #prt{display:none!important}body[data-lic="0"]::before{content:"Printing is a premium feature. Activate Premium in Plan and Wire to print.";display:block;font-size:18px;padding:20mm;text-align:center;color:#000}body[data-print=all] #pdfpg{display:block;border:2px solid #000;break-before:page;overflow:visible}#svg2{display:block;width:100%;height:auto;min-width:0}#pdfpg .pdfbg{display:block!important}#ptitle2{text-align:center;font-weight:600;font-size:18px;padding:6px;border-bottom:2px solid #000;color:#000}body[data-print] #prt{display:block;text-align:center;font-size:20px;font-weight:600;padding:2px 0 8px;color:#000}.canvas{border:2px solid #000!important}.sec{border:2px solid #000;padding:0 10px 10px;margin-bottom:8mm}.sec h3{margin:0 -10px 10px;padding:8px;font-size:18px;color:#000;text-align:center;border-bottom:2px solid #000}body[data-print=plan] #ptitle,body[data-print=all] #ptitle,body[data-print=pdf] #ptitle{display:block}}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script></head><body>
<div id="prt"></div><div class="app">
<header><h1>Plan and Wire</h1><input id="ptt" placeholder="Project title" aria-label="Project title" style="min-width:170px"><button class="btn" id="sv">Save</button><button class="btn" id="sva">Save as...</button><label class="btn" style="cursor:pointer">Open file<input type="file" id="opf" accept=".json,application/json" hidden></label><span class="hint" id="hint"></span>
<label class="btn" style="cursor:pointer">Import PDF<input type="file" id="pdfin" accept="application/pdf" hidden></label><button class="btn" id="tt" title="Minimise or maximise the tools panel">Hide tools</button><button class="btn" id="sp" title="Minimise or maximise the right panel">Hide panel</button><button class="btn" id="lic" onclick="premium()">Get Premium</button><button class="btn" onclick="newProject()">New project</button><button class="btn" id="undo">Undo</button><button class="btn" id="clear">Clear all</button><button class="btn" id="zi" title="Zoom in">Zoom +</button><button class="btn" id="zo" title="Zoom out">Zoom −</button><button class="btn" id="zf" title="Show whole plan">Fit</button><button class="btn" id="gt" title="Show or hide the grid and snapping">Grid: on</button><button class="btn" id="bk">Backup</button><select class="btn" id="pdf" title="Print or save as PDF"><option value="">Print / PDF...</option><option value="plan">Floor plan and wiring</option><option value="circuits">Circuits and power</option><option value="cable">Cable sizing per appliance</option><option value="materials">Material list</option><option value="cost">Cost estimate</option><option value="pdf">Imported PDF plan</option><option value="legend">Symbol legend</option><option value="all">Everything</option></select></header>
<nav class="tools" id="tools" aria-label="Tools"></nav>
<div class="canvas"><div id="wbar" hidden></div><div id="ptitle">Floor plan</div><svg id="svg" viewBox="0 0 1000 680" aria-label="Floor plan canvas"></svg></div>
<aside class="side" id="side"></aside>
</div>
<script>
const PX=40,W=1000,H=680,SN=10;
const D={light:{n:"Light",w:12,s:"L"},socket:{n:"Socket outlet",w:200,s:"S"},switch:{n:"Switch",w:0,s:"SW"},fan:{n:"Ceiling fan",w:75,s:"F"},ac:{n:"Air conditioner",w:1500,s:"AC"},cooker:{n:"Cooker or heater",w:3000,s:"CK"},db:{n:"Distribution board",w:0,s:"DB"}};
const TOOLS=[["Plan",[["select","Select / move"],["room","Room"],["wall","Wall (W)"],["dwall","Dotted wall"],["door","Door (D)"],["window","Window (N)"],["edoor","Empty door"],["ewin","Empty window"],["beam","Beam (B)"],["dim","Dimension"],["text","Text label"],["calib","Set PDF scale"]]],["Electrical",[["light","Light"],["socket","Socket"],["switch","Switch"],["fan","Fan"],["ac","Air conditioner"],["cooker","Cooker"],["db","Distribution board"],["wire","Wire circuit"]]]];
const CC=["#d98e00","#2b7be0","#c8403a","#2b9a62","#8a4fd0","#00a3a3","#c44f9c","#6b7a2a"];
const CN=["Lighting","Sockets A","Sockets B","Air conditioning","Cooker","Fans","Water heater","Shower"];
let S={items:[],nid:1,tool:"select",circ:-1,sel:null,volt:240,df:0.8,extra:1,hist:[]};
let tmp=null,drag=null,wfrom=null,pan=null,ws=null,wp=null,WD={dir:"0",ang:"45"},V={x:0,y:0,w:1000,h:680};
function setV(){svg.setAttribute("viewBox",V.x+" "+V.y+" "+V.w+" "+V.h)}
function clampV(){V.x=Math.max(0,Math.min(1000-V.w,V.x));V.y=Math.max(0,Math.min(680-V.h,V.y))}
function zoom(f,cx,cy){if(cx===undefined){cx=V.x+V.w/2;cy=V.y+V.h/2}const nw=Math.max(2,Math.min(200000,V.w*f)),k=nw/V.w;V.x=cx-(cx-V.x)*k;V.y=cy-(cy-V.y)*k;V.w=nw;V.h=nw*0.68;setV()}
try{const v=localStorage.getItem("planwire");if(v)S=Object.assign(S,JSON.parse(v));S.hist=[];S.circ=-1;if(S.cn)S.cn.forEach((n,k)=>{CN[k]=n})}catch(e){}
const $=id=>document.getElementById(id),svg=$("svg");
const sn=v=>S.ns?Math.round(v*10)/10:Math.round(v/SN)*SN;
function save(){try{localStorage.setItem("planwire",JSON.stringify({...S,hist:[],cn:CN}))}catch(e){}}
function snap(){S.hist.push(JSON.stringify(S.items));if(S.hist.length>50)S.hist.shift()}
function get(id){return S.items.find(i=>i.id===id)}
function pt(e){const p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());return{x:sn(q.x),y:sn(q.y)}}
function add(o){o.id=S.nid++;S.items.push(o);return o}
const isDev=i=>D[i.type];
function wlen(w){const a=get(w.a),b=get(w.b);if(!a||!b)return 0;let d=Math.abs(a.x-b.x)+Math.abs(a.y-b.y);if(w.mo==="x")d=Math.abs(w.m-a.x)+Math.abs(b.y-a.y)+Math.abs(b.x-w.m);else if(w.mo==="y")d=Math.abs(w.m-a.y)+Math.abs(b.x-a.x)+Math.abs(b.y-w.m);return d/PX+S.extra}

function render(np){
 let g='<defs><pattern id="gp" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="var(--grid)" stroke-width="1"/><path d="M20 0V40M0 20H40" stroke="var(--grid)" stroke-width=".4"/></pattern><pattern id="hp" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="var(--panel)"/><line x1="0" y1="0" x2="0" y2="7" stroke="var(--wall)" stroke-width="1.1"/></pattern></defs>'+(S.ng?"":'<rect class="gridrect" x="-100000" y="-100000" width="200000" height="200000" fill="url(#gp)"/>')+bgS();
 for(const i of [...S.items].sort((a,b)=>zo(a)-zo(b))){const s=S.sel===i.id,c=s?'var(--acc)':'var(--wall)';if(zo(i)>=2)g+=flushW();
  if(i.type==="room"){g+=`<rect data-id="${i.id}" x="${i.x}" y="${i.y}" width="${i.w}" height="${i.h}" fill="var(--room)"/>${segDraw(roomSegs(i),i,c)}<text x="${i.x+i.w/2}" y="${i.y+i.h/2}" text-anchor="middle" fill="var(--ink)" font-size="13" pointer-events="none">${esc(i.name)}</text><text x="${i.x+i.w/2}" y="${i.y+i.h/2+16}" text-anchor="middle" fill="var(--mute)" font-size="11" pointer-events="none">${rA(i)} m²</text>`+(S.rd!==false?`<text x="${i.x+i.w/2}" y="${i.y-9}" text-anchor="middle" fill="var(--acc)" font-size="11" pointer-events="none">${rW(i)} m</text><text x="${i.x-10}" y="${i.y+i.h/2+4}" text-anchor="end" fill="var(--acc)" font-size="11" pointer-events="none">${rH(i)} m</text>`:'')}
  else if(i.type==="beam")g+=beamS(i,s)+wallHandles(i,s,1);else if(i.type==="dim")g+=dimS(i,s);else if(i.type==="text")g+=`<text data-id="${i.id}" x="${i.x}" y="${i.y}" font-size="14" fill="${s?'var(--acc)':'var(--ink)'}" style="cursor:move">${esc(i.text)}</text>`;else if(i.type==="wall")g+=`${segDraw([{x1:i.x,y1:i.y,x2:i.x2,y2:i.y2}],i,c)}${wallHandles(i,s)}`;
  else if(i.type==="door"||i.type==="window"){g+=opS(i,s);continue;const l=(i.len||(i.type==="door"?0.9:1.2))*PX,r=(i.rot||0)*90,f=i.type==="door"?'#b07a3a':'#4aa3df';g+=`<g data-id="${i.id}" transform="translate(${i.x} ${i.y}) rotate(${r})"><rect x="${-l/2}" y="-5" width="${l}" height="10" fill="${f}" stroke="${s?'var(--acc)':'var(--wall)'}" stroke-width="${s?3:1.5}"/>${i.type==="door"?`<path d="M${-l/2} 5 A${l} ${l} 0 0 0 ${l/2} ${l-5}" fill="none" stroke="${f}" stroke-dasharray="3 3"/>`:''}</g>`}
 }
 g+=flushW();for(const i of S.items)if(i.type==="wire"&&get(i.a)&&get(i.b)){const a=get(i.a),b=get(i.b),s=S.sel===i.id,d=wirePath(i);g+=`<path data-id="${i.id}" d="${d}" fill="none" stroke="${CC[wcOf(i)]}" stroke-width="${s?5:2.5}" stroke-dasharray="${s?'':'7 3'}"/><path data-id="${i.id}" d="${d}" fill="none" stroke="transparent" stroke-width="14"/>${s?wireHandles(i):""}`}
 for(const i of S.items)if(isDev(i)){const s=S.sel===i.id,col=i.type==="db"?'var(--ink)':CC[i.c||0];
  g+=symG(i,s,col)}
 if(tmp){const a=tmp;g+=S.tool==="room"?`<rect x="${Math.min(a.x,a.x2)}" y="${Math.min(a.y,a.y2)}" width="${Math.abs(a.x2-a.x)}" height="${Math.abs(a.y2-a.y)}" fill="var(--room)" stroke="var(--acc)" stroke-opacity=".7" stroke-width="${tpx({})}"/>`:`<line x1="${a.x}" y1="${a.y}" x2="${a.x2}" y2="${a.y2}" stroke="var(--acc)" stroke-width="4" stroke-dasharray="6 4"/>`;
  const L=S.tool==="room"?`${(Math.abs(a.x2-a.x)/PX).toFixed(2)} x ${(Math.abs(a.y2-a.y)/PX).toFixed(2)} m`:`${(Math.hypot(a.x2-a.x,a.y2-a.y)/PX).toFixed(2)} m`;g+=`<text x="${a.x2+10}" y="${a.y2-8}" font-size="12" fill="var(--acc)">${L}</text>`}
 if(ws&&S.tool==="wall"){g+=`<circle cx="${ws.x}" cy="${ws.y}" r="6" fill="var(--acc)"/>`;if(wp)g+=`${wallPrev(ws,wp)}<text x="${wp.x+10}" y="${wp.y-8}" font-size="12" fill="var(--acc)">${(Math.hypot(wp.x-ws.x,wp.y-ws.y)/PX).toFixed(2)} m</text>`}
 if(PA&&PA.a&&PA.b){const x1=Math.min(PA.a.x,PA.b.x),y1=Math.min(PA.a.y,PA.b.y),x2=Math.max(PA.a.x,PA.b.x),y2=Math.max(PA.a.y,PA.b.y);g+=`<path d="M-100000 -100000H100000V100000H-100000Z M${x1} ${y1}V${y2}H${x2}V${y1}Z" fill="rgba(0,0,0,.35)" fill-rule="evenodd" pointer-events="none"/><rect x="${x1}" y="${y1}" width="${x2-x1}" height="${y2-y1}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-dasharray="8 4" pointer-events="none"/><text x="${x1+4}" y="${y1-6}" font-size="11" fill="var(--acc)">${((x2-x1)/PX).toFixed(1)} x ${((y2-y1)/PX).toFixed(1)} m</text>`}
 if(cal&&S.tool==="calib"&&LP){const q=SNP||LP;g+=`<line x1="${cal.x}" y1="${cal.y}" x2="${q.x}" y2="${q.y}" stroke="var(--acc)" stroke-width="${1.5*V.w/1000}" stroke-dasharray="${6*V.w/1000} ${4*V.w/1000}"/><text x="${q.x+10*V.w/1000}" y="${q.y-10*V.w/1000}" font-size="${12*V.w/1000}" fill="var(--acc)">${(Math.hypot(q.x-cal.x,q.y-cal.y)/PX).toFixed(3)} m at the current scale</text>`}
 if(SNP&&(S.tool==="wall"||S.tool==="room"||S.tool==="dim"||S.tool==="calib"))g+=`<circle cx="${SNP.x}" cy="${SNP.y}" r="7" fill="none" stroke="var(--acc)" stroke-width="2"/><circle cx="${SNP.x}" cy="${SNP.y}" r="2.2" fill="var(--acc)"/><text x="${SNP.x+10}" y="${SNP.y-10}" font-size="10" fill="var(--acc)">${SNP.k}</text>`;
 if(cal)g+=`<circle cx="${cal.x}" cy="${cal.y}" r="6" fill="var(--acc)"/>`;
 const pt0=$("ptt");if(pt0&&document.activeElement!==pt0)pt0.value=S.title||"";$("gt").textContent=S.ng?"Grid: off":"Grid: on";svg.innerHTML=g;if(!np)panels();save()}
function dimS(i,s){const c=s?'var(--acc)':'#c0392b',dx=i.x2-i.x,dy=i.y2-i.y,L=Math.hypot(dx,dy),a=Math.atan2(dy,dx)*180/Math.PI,mx=(i.x+i.x2)/2,my=(i.y+i.y2)/2;
 const tk=(x,y)=>`<line x1="${x-6}" y1="${y+6}" x2="${x+6}" y2="${y-6}" stroke="${c}" stroke-width="2" transform="rotate(${a} ${x} ${y})"/>`;
 return `<g data-id="${i.id}" style="cursor:move"><line x1="${i.x}" y1="${i.y}" x2="${i.x2}" y2="${i.y2}" stroke="${c}" stroke-width="1.5"/><line x1="${i.x}" y1="${i.y}" x2="${i.x2}" y2="${i.y2}" stroke="transparent" stroke-width="14"/>${tk(i.x,i.y)}${tk(i.x2,i.y2)}<text transform="translate(${mx} ${my}) rotate(${a>90||a<-90?a+180:a})" text-anchor="middle" y="-5" font-size="12" fill="${c}">${(L/PX).toFixed(2)} m</text>${s?`<circle data-h="1" cx="${i.x}" cy="${i.y}" r="7" fill="var(--panel)" stroke="${c}" stroke-width="2" style="cursor:crosshair"/><circle data-h="2" cx="${i.x2}" cy="${i.y2}" r="7" fill="var(--panel)" stroke="${c}" stroke-width="2" style="cursor:crosshair"/>`:''}</g>`}
function symK(t,c){if(SY[t])return SY[t](c);const b=`stroke="${c}" stroke-width="2" fill="none"`,p=`fill="var(--panel)" stroke="${c}" stroke-width="2"`;
 if(t==="light")return `<circle r="11" ${p}/><path d="M-8-8L8 8M8-8L-8 8" ${b}/>`;
 if(t==="socket")return `<path d="M-10 5A10 10 0 0 1 10 5Z" ${p}/><path d="M0 5V11" ${b}/>`;
 if(t==="switch")return `<circle r="5" ${p}/><path d="M4-4L13-13M9.5-16.5L16.5-9.5" ${b}/>`;
 if(t==="fan")return [0,90,180,270].map(r=>`<ellipse cy="-9" rx="3.5" ry="7" ${p} transform="rotate(${r})"/>`).join("")+`<circle r="3" fill="${c}"/>`;
 if(t==="ac")return `<rect x="-17" y="-9" width="34" height="18" ${p}/><path d="M-13-3H13M-13 3H13" ${b}/>`;
 if(t==="cooker")return `<rect x="-14" y="-14" width="28" height="28" ${p}/>`+[[-6,-6],[6,-6],[-6,6],[6,6]].map(q=>`<circle cx="${q[0]}" cy="${q[1]}" r="4" ${b}/>`).join("");
 return `<rect x="-15" y="-11" width="30" height="22" ${p}/><path d="M-15 11L15-11V11Z" fill="${c}"/>`}

function upd(k,v,nr){const s=get(S.sel);if(!s)return;snap();s[k]=v;if(k==="c"){if(s.type==="wire")[get(s.a),get(s.b)].forEach(d=>{if(d&&d.type!=="db")d.c=v});else if(isDev(s))S.items.forEach(w=>{if(w.type==="wire"&&(w.a===s.id||w.b===s.id))w.c=v})}if(nr){render(1);return}render()}
function del(){if(!S.sel)return;snap();S.items=S.items.filter(i=>i.id!==S.sel&&i.a!==S.sel&&i.b!==S.sel);S.sel=null;render()}
